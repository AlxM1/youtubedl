<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VidGrab</title>

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#0f1117" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VidGrab" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />

  <!-- Android -->
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Install banner -->
  <div id="install-banner" class="install-banner hidden">
    <span>Install VidGrab for quick access</span>
    <button id="install-btn" onclick="installApp()">Install</button>
    <button class="install-dismiss" onclick="dismissInstall()">&times;</button>
  </div>

  <div class="container">
    <header>
      <div class="header-row">
        <h1>VidGrab</h1>
        <button class="btn-icon" onclick="toggleSettings()" aria-label="Settings" id="settings-toggle">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="3"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M3.4 3.4l1.4 1.4M15.2 15.2l1.4 1.4M16.6 3.4l-1.4 1.4M4.8 15.2l-1.4 1.4"/></svg>
        </button>
      </div>
      <p class="subtitle">YouTube &middot; X &middot; Instagram &middot; TikTok &middot; Facebook</p>
    </header>

    <!-- Settings panel -->
    <section class="card hidden" id="settings-panel">
      <h3 class="settings-title">Settings</h3>
      <div class="settings-row">
        <label for="settings-apikey">API Key</label>
        <div class="settings-input-row">
          <input type="password" id="settings-apikey" placeholder="Enter API key..." />
          <button class="btn-sm" onclick="saveApiKey()">Save</button>
        </div>
      </div>
      <div class="settings-row">
        <label>Server</label>
        <span id="settings-health" class="text-muted">Checking...</span>
      </div>
    </section>

    <!-- URL Input -->
    <section class="card" id="input-section">
      <div class="url-row">
        <input type="url" id="url-input" placeholder="Paste video URL here..." autocomplete="off" inputmode="url" enterkeyhint="go" />
        <button id="fetch-btn" onclick="fetchFormats()">
          <span class="btn-label">Fetch</span>
          <svg class="btn-icon-inline" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </div>
      <button class="paste-btn" onclick="pasteFromClipboard()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Paste from clipboard
      </button>
      <div id="fetch-error" class="error-msg hidden"></div>
      <div id="fetch-spinner" class="spinner hidden"></div>
    </section>

    <!-- Format Selector (shown after fetch) -->
    <section class="card hidden" id="format-section">
      <div class="video-preview">
        <img id="preview-thumb" src="" alt="" />
        <div class="preview-info">
          <h3 id="preview-title"></h3>
          <div class="preview-meta">
            <span id="preview-platform" class="badge"></span>
            <span id="preview-duration"></span>
            <span id="preview-uploader" class="text-muted"></span>
          </div>
        </div>
      </div>

      <div class="format-controls">
        <div class="format-group">
          <label>Format</label>
          <select id="format-select"></select>
        </div>
        <button id="download-btn" onclick="startDownload()">
          <svg class="btn-icon-inline" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span>Download</span>
        </button>
      </div>

      <div class="quick-picks">
        <button class="chip" onclick="quickPick('best')">Best MP4</button>
        <button class="chip" onclick="quickPick('best_audio')">Audio Only</button>
      </div>
    </section>

    <!-- Downloads Queue & History -->
    <section class="card">
      <div class="section-header">
        <h2>Downloads</h2>
        <button class="btn-sm" onclick="refreshDownloads()">Refresh</button>
      </div>
      <div id="downloads-list">
        <p class="empty-state">No downloads yet. Paste a URL above to get started.</p>
      </div>
    </section>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <script src="/static/app.js"></script>
</body>
</html>
