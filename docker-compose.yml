services:
  downloader:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - vidgrab_data:/app/data
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - DATABASE_URL=sqlite+aiosqlite:////app/data/vidgrab.db
      - MAX_CONCURRENT_DOWNLOADS=3
      # Required: set a strong API key to protect the instance
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
      # - API_KEY=your-secret-key-here
      #
      # Optional: rate limit on format extraction (per IP per minute)
      # - EXTRACT_RATE_LIMIT=10
      #
      # Optional: minimum free disk space before refusing downloads (MB)
      # - MIN_FREE_DISK_MB=500
      #
      # Optional: path to cookies.txt for auth-required content
      # - COOKIES_FILE=/app/cookies.txt
    restart: unless-stopped

volumes:
  vidgrab_data:
